# Publishing to npm with a provenance statement.
#
# n8n requires community nodes to be published through GitHub Actions with
# provenance since 1 May 2026; without it the package cannot be verified.
# Provenance needs "id-token: write" and a public repository, so this repository
# has to live on GitHub and be public for a release to work.
#
# Set NPM_TOKEN (automation token) as a repository secret before the first run.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # package.json is the single source of truth for what gets published, so
      # everything downstream reads the name and version from it. A tag that
      # disagrees is a mistake, not an override: npm would publish the version in
      # package.json under a tag claiming a different one. A manual dispatch has
      # no tag to compare against and skips the check - there GITHUB_REF_NAME is
      # the branch, which is exactly why nothing else may use it either.
      - name: Read the package identity
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag and package version must agree
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.package.outputs.version }}" != "$TAG_VERSION" ]; then
            echo "package.json is ${{ steps.package.outputs.version }} but the tag says $TAG_VERSION"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      # The trigger holds the only real logic in this package, and the tests
      # assert how many API requests a poll costs. That is worth a release gate:
      # a regression there spends a customer's monthly credit budget quietly.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # package.json keeps a prepublishOnly hook that refuses a plain npm
      # publish and points at `npm run release` instead. That guard is worth
      # having against an accidental publish from a laptop, and RELEASE_MODE is
      # its own escape hatch - the same one `n8n-node release` sets. Removing
      # the hook would have been the other way to get past it, and the worse one.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'

      # npm answers the publish before the version is readable: "your package is
      # being processed and may take a few minutes to become available". The
      # scanner below resolves by name from the registry, so without this wait it
      # reliably reports "No package metadata found" for the version that was
      # just published - which is a race, not a finding.
      - name: Wait for the registry to serve the new version
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/${{ steps.package.outputs.name }}/${{ steps.package.outputs.version }}"; then
              echo "visible after $((i * 15))s"
              exit 0
            fi
            sleep 15
          done
          echo "${{ steps.package.outputs.version }} did not appear on the registry within 10 minutes"
          exit 1

      # The scanner resolves a package by name from the registry, so it cannot
      # look at a tarball and cannot run before the publish. It is a verification
      # of what went out, which is why a failure here means deprecating the
      # version rather than retrying.
      #
      # It prints its verdict and exits 0 either way, so the step has to read the
      # output to fail. Taking the exit code at face value cost the Sage package
      # one release: 0.1.1 went out with the scan reporting a failure under a
      # green tick, and 0.2.1 here was published through the same blind gate.
      - name: Check the published package against the community rules
        run: |
          set -o pipefail
          npx @n8n/scan-community-package "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" 2>&1 | tee scan.log
          if grep -q '❌' scan.log; then
            echo "::error::the community scan reported a failure"
            exit 1
          fi
